# Determines whether to produce particle detection output
outputs:
  particle_detection: true

# Configuration options for particle detection functions
particle_detection:
  # Radius of circles to draw around particles
  label_radius: 127
  # Blur, thresholding, and area bounds to use for detection - these should be tuned for a given system.
  microorganism_blur: 5
  microorganism_threshold_min: 4
  microorganism_threshold_max: 100
  min_microorganism_area: 100
  max_microorganism_area: 676.500
  # Whether to use particle shape to filter candidates
  filter_by_shape: false
  # Shape parameters to use, if filter_by_shape is true
  shape_min_eccentricity: 0.215
  shape_max_eccentricity: 0.978
  shape_min_solidity: 0.809
  shape_max_solidity: 0.987
  shape_min_aspectratio: 0.277
  shape_max_aspectratio: 4.0
  shape_min_perimeter: 20  
  shape_max_perimeter: 140 
  shape_min_feret: 9  
  shape_max_feret: 60 
  max_majoraxis: 100 
  min_axisratio: 0.001 
  max_axisratio: 10 

# Whether or not to apply the well, bubble, and track masks
masks:
  well_mask: true
  bubble_mask: true
  track_mask: true

# Optimisation parameters and file locations
optimize:
  # File locations
  training_path: C:/wellcounter/training_data_for_MEE
  output_folder: C:/wellcounter/training_data_for_MEE
  # Possible values for thresholding
  threshold_from: 8
  threshold_step: 8
  threshold_to: 24
  # Possible values for particle area bounds
  area_from: 150
  area_step: 50
  area_to: 400
  